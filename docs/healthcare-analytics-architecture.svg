<rect x="28" y="690" width="480" height="42" rx="14" fill="#173653"/><text x="52" y="719" font-size="22" font-weight="bold" fill="#fff">Project Scope</text>
<text x="52" y="770" class="body">Synthetic healthcare-technology commercial data</text><text x="52" y="803" class="body">18,000 transactions • 500 customers • 24 months</text><text x="52" y="836" class="small">No real patient or customer information</text>

